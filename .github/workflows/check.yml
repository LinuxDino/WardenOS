name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 tests/check.py
      - run: python3 tests/test_drone_tasks.py
      - run: python3 tests/test_nav.py
      - run: python3 tests/test_claude.py
      - run: python3 tests/test_pocket.py
      - run: python3 tests/test_map.py
      - run: python3 tests/test_dashboard.py
      - run: python3 tests/test_bin.py
      - run: python3 tests/test_mineview.py
      - run: python3 tests/test_todo.py
      - run: python3 tests/test_store.py
      - run: python3 tests/test_ui.py
      - run: python3 tests/test_tradeview.py
      - run: python3 tests/test_me.py
      - run: python3 tests/test_gps.py
